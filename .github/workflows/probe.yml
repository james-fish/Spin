name: probe-sources
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          curl -sS -m 15 https://locusonus.org/soundmap/list/ -o list.json
          python3 - <<'P'
          import json,collections
          d=json.load(open('list.json'));print(len(d),'entries')
          print(collections.Counter(x.get('ext') for x in d))
          print(collections.Counter(x['url'].split('/')[2] for x in d))
          print('keys',list(d[0].keys()))
          for x in d[:60]: print(x['ext'],x['url'],'|',x['name'],'|',x.get('country'))
          P
          for ext in mp3 ogg; do
            U=$(python3 -c "import json;print([x['url'] for x in json.load(open('list.json')) if x['ext']=='$ext'][0])" 2>/dev/null)
            echo "=== $ext stream $U"; curl -sS -m 6 -D - -o /dev/null -H 'Origin: https://james.fish' "$U" 2>&1 | grep -iE '^(HTTP|access-control|content-type|curl)'
          done
