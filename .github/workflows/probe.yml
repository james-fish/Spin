name: probe-sources
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://locus.creacast.com:9001/status-json.xsl http://locus.creacast.com:9001/status-json.xsl http://locus.creacast.com:8000/status-json.xsl https://locus.creacast.com/status-json.xsl https://locusonus.org/soundmap/ https://locusonus.org/soundmap/list/ ; do
            echo "=== $u"; curl -sS -m 15 -D - -o body -H 'Origin: https://james.fish' "$u" 2>&1 | grep -iE '^(HTTP|access-control|content-type|location|curl)' ; head -c 300 body 2>/dev/null; echo; rm -f body
          done
          echo "=== soundmap page stream refs"
          curl -sS -m 15 https://locusonus.org/soundmap/ | grep -oE '(https?:)?//[^"'"'"' ]*(creacast|stream|\.json|api)[^"'"'"' ]*' | sort -u | head -30
